services:
  akz:
    build: .
    image: akz-voyages
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"   # only nginx on the VM talks to it
    environment:
      # Used only when there is no admin account yet (first start without a backup).
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: ${AKZ_ADMIN_PASSWORD:?set AKZ_ADMIN_PASSWORD in .env}
      # Behind an HTTPS reverse proxy (Caddy, nginx, Traefik): real client IPs and Secure cookies.
      TRUST_PROXY: "1"
      # Off-site backup of every photo and the data file to a private GitHub repo (optional, see README).
      GITHUB_BACKUP_REPO: ${GITHUB_BACKUP_REPO:-}
      GITHUB_BACKUP_TOKEN: ${GITHUB_BACKUP_TOKEN:-}
    volumes:
      - akz-data:/data

volumes:
  akz-data:
